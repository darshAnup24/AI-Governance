global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy:8000"]

  - job_name: detection
    metrics_path: /metrics
    static_configs:
      - targets: ["detection:8001"]

  - job_name: governance
    metrics_path: /metrics
    static_configs:
      - targets: ["governance:4000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
