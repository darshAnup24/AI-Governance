# ─────────────────────────────────────────────────────────────
# OpenTelemetry Collector — minimal stub config
# Replace `debug` exporter with your real backend (e.g. clickhouse,
# otlp/<->jaeger, prometheus) when ready.
# ─────────────────────────────────────────────────────────────
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

extensions: {}

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
