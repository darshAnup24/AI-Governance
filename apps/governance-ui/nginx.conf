server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Auth + governance dashboard API → Node.js governance backend (port 4000)
    # Auth routes (login, signup, refresh, logout) live on the governance service.
    # The frontend sends them as /api/governance/api/auth/* and the legacy
    # governance backend serves them under /api/auth/*.
    # Handles /api prefixed Axios requests (e.g. /api/governance/api/auth/login)
    location /api/governance/api/ {
        proxy_pass http://governance:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/governance/ {
        proxy_pass http://governance:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Bare /api/auth/* also routes to the governance backend (covers
    # code paths that hit /api/auth/login directly).
    location /api/auth/ {
        proxy_pass http://governance:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (chat completions, detection passthrough) → Python gateway
    location /api/ {
        proxy_pass http://proxy:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
