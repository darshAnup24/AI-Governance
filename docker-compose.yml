services:
  # ─── Proxy Service ──────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./proxy:/app/proxy
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - UPSTREAM_OPENAI_URL=${UPSTREAM_OPENAI_URL:-https://api.openai.com}
      - UPSTREAM_ANTHROPIC_URL=${UPSTREAM_ANTHROPIC_URL:-https://api.anthropic.com}
      - DETECTION_SERVICE_URL=http://detection:8001
      - DETECTION_TIMEOUT_MS=2000
      - GOVERNANCE_API_URL=http://governance:4000
      - GOVERNANCE_SERVICE_TOKEN=internal-service-token-change-me
      - DATABASE_URL=postgresql+asyncpg://aigw:aigw_password@postgres:5432/ai_governance
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_URL=http://clickhouse:8123
      - OLLAMA_URL=https://api.groq.com/openai
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=airlock-dev-secret-change-me
      - DEV_JWT_SECRET=dev-secret-change-in-production
      - DEV_ORG_ID=865e5d01-ec17-4a7a-b5b5-122fde3febe5
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=airlock-proxy
      - GOVERNANCE_API_URL=http://governance:4000
      - DEMO_API_URL=http://demo-api:4001
    command: /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      governance:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-gateway-net

  # ─── Detection Service ─────────────────────────────────
  detection:
    build:
      context: .
      dockerfile: detection/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./proxy:/app/proxy
      - ./detection:/app/detection
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=https://api.groq.com/openai/v1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=airlock-detection
    command: uvicorn detection.app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-gateway-net

  # ─── Governance Service (Node.js) ─────────────────────────
  governance:
    build:
      context: ./governance
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./governance/src:/app/src
      - ./governance/prisma:/app/prisma
    environment:
      - GOVERNANCE_PORT=4000
      - DATABASE_URL=postgresql://aigw:aigw_password@postgres:5432/ai_governance
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_URL=http://clickhouse:8123
      - DETECTION_SERVICE_URL=http://detection:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PRIMARY_ADVISOR_MODEL=llama3-70b-8192
      - FALLBACK_MODEL=llama3-8b-8192
      - USE_ONNX_DETECTION=true
      - ALLOW_INSECURE_DEFAULT_SECRETS=true
      - JWT_SECRET=airlock-dev-secret-change-me
      - INTERNAL_SERVICE_TOKEN=internal-service-token-change-me
      - CORS_ORIGIN=http://localhost:3000
      - DEMO_MODE=${DEMO_MODE:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=airlock-governance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      detection:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-gateway-net

  # ─── React Dashboard ───────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_GOVERNANCE_URL=${VITE_GOVERNANCE_URL:-http://localhost:4000}
        - VITE_DEMO_MODE=${VITE_DEMO_MODE:-true}
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_GOVERNANCE_URL=${VITE_GOVERNANCE_URL:-http://localhost:4000}
      - DEMO_MODE=${DEMO_MODE:-true}
      - VITE_DEMO_MODE=${VITE_DEMO_MODE:-true}
    depends_on:
      - proxy
      - governance
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ai-gateway-net

  # ─── PostgreSQL + TimescaleDB ──────────────────────────
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=aigw
      - POSTGRES_PASSWORD=aigw_password
      - POSTGRES_DB=ai_governance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigw -d ai_governance"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-net

  # ─── ClickHouse Analytics Database ─────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-net

  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-net

  # ─── AlertManager ─────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ai-gateway-net

  # ─── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ai-gateway-net

  # ─── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=airlock
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./scripts/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./scripts/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./scripts/grafana/contact-points.yml:/etc/grafana/provisioning/contact-points.yml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ai-gateway-net

  # ─── OpenTelemetry Collector ───────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./infra/otel-collector/config.yml:/etc/otel-collector-config.yml
    command: ["--config=/etc/otel-collector-config.yml"]
    depends_on:
      - clickhouse
    networks:
      - ai-gateway-net

  # ─── Demo API (Sandbox Backend) ────────────────────────
  demo-api:
    build:
      context: ./services/demo-api
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - DEMO_API_PORT=4001
      - DEMO_JWT_SECRET=demo-secret-change-in-production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=airlock-demo-api
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ai-gateway-net

  # ─── DNS Sinkhole ──────────────────────────────────────
  dns-sinkhole:
    build:
      context: .
      dockerfile: detection/Dockerfile
    command: python -m detection.app.dns_sinkhole
    environment:
      - DNS_UPSTREAM=8.8.8.8
      - DNS_PORT=5353
      - DNS_SINKHOLE_IP=${AIRLOCK_PROXY_IP:-127.0.0.1}
      - PROXY_ALERT_URL=http://proxy:8000
      - SINKHOLE_PASSTHROUGH=${SINKHOLE_PASSTHROUGH:-false}
    volumes:
      - ./detection:/app/detection
      - ./proxy:/app/proxy
    depends_on:
      - proxy
      - detection
    networks:
      - ai-gateway-net

volumes:
  postgres_data:
  redis_data:
  # ollama_data removed — using Groq API
  clickhouse_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  ai-gateway-net:
    driver: bridge
